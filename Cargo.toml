[package]
name = "lazy_cnpj"
version = "0.1.0"
edition = "2024"
authors = ["Lucas Augusto <lucas210898.lao@gmail.com>"]
description = "High performance ingestor TUI for CNPJs"
repository = "https://github.com/realfakenerd/lazy_cnpj/"

[dependencies]
# UI & Terminal
ratatui = { version = "0.30.2", features = ["crossterm", "macros"] }
ratatui-textarea = "0.9.2"
throbber-widgets-tui = "0.11.1"
tui-overlay = "0.1.2"
tui-scrollview = "0.6.7"
tui-logger = "0.18.3"

tokio = { version = "1.53.1", features = ["full"] }
sysinfo = "0.39.6"

diesel = { version = "2.3.11", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3.2"

csv = "1.4.0"
zip = "8.6.0"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.151"

open = "5.4.1"
arboard = "3.6.1"
